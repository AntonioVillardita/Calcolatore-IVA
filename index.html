<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Calcolatore IVA</title>

    <link rel="stylesheet" href="style.css">
  </head>
  
  <body>
    <h1>Calcolo IVA</h1>

    <div class="container">
        <div class="campi">
            <label>Prezzo senza IVA</label>
            <input type="number" id="prezzo" class="prezzo"/>
        </div>
        
        <div class="campi">
            <label>Percentuale IVA</label>
            <select id="selectIva">
                <option value="22">22%</option>
                <option value="10">10%</option>
                <option value="5">5%</option>
                <option value="4">4%</option>
            </select>
        </div>

        <div class="campi">
            <label>Prezzo con IVA</label>
            <input type="text" value="€0,00" id="pricePlus" class="pricePlus" readonly/>
        </div>
        
        <div class="campi">
            <label>IVA</label>
            <input type="text" value="€0,00" id="iva" class="iva" readonly/>
        </div>

    </div>

    <script src="script.js"></script>
  
</body>
</html>
